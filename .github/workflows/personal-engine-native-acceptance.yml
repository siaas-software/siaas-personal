name: Personal native acceptance (disabled preparation)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Reviewed standard native targets; access remains unverified
        required: true
        type: choice
        default: linux-x64
        options: [linux-x64, linux-arm64, windows-x64, windows-arm64, macos-x64, macos-arm64, linux, windows, macos, all]
      baseline:
        description: Exact approved baseline SHA only
        required: true
        type: string
        default: 17202c5964d9282efd4a1991c548612287c65dbb
      candidate:
        description: Exact approved PR25 SHA only
        required: true
        type: string
        default: e7f8feb5185d4d64c23ace6a904b637c726b97ff
      authorization:
        description: This preparation does not authorize execution
        required: true
        type: choice
        default: PREPARATION_ONLY
        options: [PREPARATION_ONLY]

permissions:
  contents: read

concurrency:
  group: personal-engine-native-acceptance
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.validate.outputs.matrix }}
      stable: ${{ steps.validate.outputs.stable }}
      previous: ${{ steps.validate.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed v4
        with:
          repository: siaas-software/siaas-personal
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # reviewed v4
        with:
          node-version: 24.22.0
      - name: Validate inputs, history approvals and closed execution gate
        id: validate
        shell: bash
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_BASELINE: ${{ inputs.baseline }}
          INPUT_CANDIDATE: ${{ inputs.candidate }}
          INPUT_AUTHORIZATION: ${{ inputs.authorization }}
        run: node tests/native-acceptance/prepare.mjs

  native:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: siaas-software/siaas-personal
          ref: ${{ github.workflow_sha }}
          path: infrastructure
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: siaas-software/siaas-personal
          ref: ${{ matrix.sha }}
          path: application
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: siaas-software/siaas-personal
          ref: ${{ needs.plan.outputs.stable }}
          path: historical-stable
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: siaas-software/siaas-personal
          ref: ${{ needs.plan.outputs.previous }}
          path: historical-previous
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
          architecture: ${{ matrix.arch }}
      - name: Isolated native lifecycle acceptance
        shell: bash
        env:
          ACCEPTANCE_TARGET: ${{ matrix.target }}
          ACCEPTANCE_ROLE: ${{ matrix.role }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            command -v xvfb-run >/dev/null || exit 2
            xvfb-run -a node infrastructure/tests/native-acceptance/run.mjs
          else
            node infrastructure/tests/native-acceptance/run.mjs
          fi
      - name: Validate the exact bounded evidence file before upload
        if: always()
        id: evidence
        shell: bash
        run: node infrastructure/tests/native-acceptance/evidence.mjs evidence-native
      - name: Upload validated JSON only
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}-${{ matrix.role }}-${{ github.run_attempt }}
          path: evidence-native/native.json
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
