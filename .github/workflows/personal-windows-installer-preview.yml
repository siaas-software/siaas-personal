name: Personal RC4 Windows installer preview

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/personal-windows-installer-preview.yml'
      - 'docs/distribution/personal-windows-installer-preview.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-rc4-setup-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-windows-x64:
    if: github.repository == 'siaas-software/siaas-personal'
    name: Build isolated Personal RC4 setup (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout exact immutable published RC4 source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: d8bf6e61a4d47920a00cc4e069a90cf26ac2d80f
          fetch-depth: 1
      - name: Verify provenance before running any package scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne 'd8bf6e61a4d47920a00cc4e069a90cf26ac2d80f') { throw "Unexpected Personal source SHA: $sha" }
          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.1.0-rc.4') { throw 'Unexpected Personal version' }
          Write-Host "Verified immutable RC4 source: $sha"
      - name: Install pinned Node 24.22.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
          architecture: x64
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run application typecheck
        run: npm run typecheck
      - name: Build one-file Windows installer (unsigned preview only)
        run: npm run desktop:package -- --x64
      - name: Validate package file and record checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath dist -Filter 'SIAAS-Personal-1.1.0-rc.4-*.exe' -File)
          if ($files.Count -ne 1) { throw "Expected one RC4 setup executable; found $($files.Count)" }
          if ($files[0].Length -lt 1000000) { throw 'Setup executable unexpectedly small' }
          $sha = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Personal RC4 setup: $($files[0].Name)"
          Write-Host "SHA256: $sha"
          Write-Host "Bytes: $($files[0].Length)"
      - name: Upload test installer (not a GitHub release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SIAAS-Personal-RC4-Windows-x64-Preview-Unsigned
          path: dist/SIAAS-Personal-1.1.0-rc.4-*.exe
          if-no-files-found: error
          retention-days: 14
